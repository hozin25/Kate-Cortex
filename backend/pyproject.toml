[project]
name = "kate-cortex"
version = "0.1.0"
description = "Kate-Cortex backend: local-first knowledge base + AI chat service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "jieba>=0.42",
    "pypinyin>=0.53",
    "openai>=3.1.0",
    "anthropic>=1.2.0",
    "sqlite-vec>=0.1.9",
    "scikit-learn>=1.9.0",
    "mcp>=2.1,<3",  # v2 重命名了传输与字段（streamable_http_client / input_schema）
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kate_cortex"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/kate_cortex"]
omit = ["src/kate_cortex/main.py"]
