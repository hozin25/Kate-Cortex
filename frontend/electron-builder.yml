appId: com.katecortex.app
productName: Kate-Cortex
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Python 后端 exe（backend/dist/kate-cortex-server.exe，PyInstaller 产物）
# → 安装包 resources/sidecar/，主进程经 process.resourcesPath 定位
extraResources:
  - from: ../backend/dist/kate-cortex-server.exe
    to: sidecar/kate-cortex-server.exe
win:
  executableName: Kate-Cortex
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: Kate-Cortex-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
npmRebuild: false
# 显式 generic 渠道：阻止 electron-builder 联网推断 GitHub 发布（离线构建）
publish:
  provider: generic
  url: https://example.com/auto-updates
